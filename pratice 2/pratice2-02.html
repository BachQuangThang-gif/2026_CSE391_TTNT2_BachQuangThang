<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joe's Travel Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #9d337b; 
            display: flex;
            justify-content: center;
            padding: 20px 0;
        }

        .wrapper {
            width: 95%;
            max-width: 1200px;
            background-color: #fff;
            border: 2px solid #ff9966; 
        }
        header {
            background-color: #55b89a; 
            padding: 10px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff9966;
        }

        .logo {
            color: #ffff00;
            font-weight: bold;
            font-style: italic;
            font-size: 1.4rem;
        }

        nav a {
            color: #ffff00;
            text-decoration: none;
            margin-left: 15px;
            font-size: 0.8rem;
            border: 1px solid #ffff00;
            padding: 2px 8px;
        }
        main {
            display: block;
        }
        .hero {
            height: 450px;
            background: url('ocean.jpg') no-repeat center center/cover;
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 2px solid #ff9966;
        }

        .hero-content {
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 30px 50px;
            text-align: center;
            border-radius: 8px;
        }

        .hero-content h1 {
            font-size: 2.2rem;
            margin-bottom: 5px;
        }

        .hero-content p {
            font-size: 0.75rem;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn {
            background-color: #ffff00;
            color: #000;
            padding: 10px 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 4px;
        }

        .highlights {
            background-color: #e1f5fe; 
            padding: 40px 20px;
            text-align: center;
        }

        .highlights h2 {
            font-size: 1.1rem;
            margin-bottom: 30px;
            letter-spacing: 2px;
            color: #444;
        }

        .card-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .card {
            flex: 1;
        }

        .card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card p {
            margin-top: 15px;
            font-size: 0.75rem;
            font-weight: bold;
            color: #333;
        }

        .card p span {
            color: #009688;
            font-weight: normal;
        }

        /* FOOTER */
        footer {
            background-color: #1a1a1a;
            padding: 20px;
            text-align: center;
            border-top: 2px solid #ff9966;
        }

        footer i {
            color: white;
            font-size: 2rem;
            margin: 0 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <header>
            <div class="logo">TRAVEL GOALS</div>
            <nav>
                <a href="#">Destinations</a>
                <a href="#">About</a>
            </nav>
        </header>

        <main>
            <section class="hero">
                <div class="hero-content">
                    <h1>JOE'S TRAVEL PAGE</h1>
                    <p>Let's explore the world together!</p>
                    <a href="#" class="btn">Discover places</a>
                </div>
            </section>

            <section class="highlights">
                <h2>HIGHLIGHTS</h2>
                <div class="card-container">
                    <div class="card">
                        <img src="miami.jpg" alt="Miami">
                        <p>MIAMI <span>USA</span></p>
                    </div>
                    <div class="card">
                        <img src="munich.jpg" alt="Munich">
                        <p>MUNICH <span>GERMANY</span></p>
                    </div>
                    <div class="card">
                        <img src="barcelona.jpg" alt="Barcelona">
                        <p>BARCELONA <span>SPAIN</span></p>
                    </div>
                </div>
            </section>
        </main>

        <footer>
            <i class="fab fa-instagram"></i>
            <i class="fab fa-facebook"></i>
        </footer>
    </div>

</body>
</html>
