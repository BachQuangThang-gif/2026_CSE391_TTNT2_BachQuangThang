<!DOCTYPE html>
<html lang="en">
<style>
    *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body{
    font-family: Arial, Helvetica, sans-serif;
    background-color: white;
    display: flex;
    justify-content: center;
}
.container{
    background-color: white;
    border: 1px solid black;
    padding: 50px 55px;
    width: 100%;
    max-width: 95%;
}
.container h3{
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 20px;
    color: black;
}
.name{
    display: flex;
    gap: 20px;
    margin-bottom: 15px;
}
.name input{
    flex: 1;
    padding: 10px 15px;
}
.subject{
    display: flex;
    margin-bottom: 15px;
}
.subject input{
    flex: 1;
    padding: 10px 15px;
}
.message{
    display: flex;
    margin-bottom: 15px;
}
.message textarea{
    flex: 1;
    padding-bottom: 150px;
    padding-top: 10px;
    padding-left: 10px;
}
.send{
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.send button{
    background-color: rgb(62, 182, 247);
    font-size: 10px;
    padding: 8px 8px;
    border-radius: 5px;
    color: white;
}
.send p{
    color: gray;
    font-size: 10px;
}
    
</style>    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 1</title>
    <link rel="stylesheet" href="bai1.css">
</head>
<body>
    <div class="container">
        <h3>Get in touch with us by  filling contact form below</h3>
        <form action="">
            <div class="name">
                <input type="text" placeholder="*Enter your full name">
                <input type="email" placeholder="*Enter your email address">
            </div>
            <div class="subject">
                <input type="text" placeholder="Enter your subject">
            </div>
            <div class="message">
                <textarea placeholder="*Your message here..."></textarea>
            </div>
            <div class="send">
                <button type="bottom">Send message</button>
                <p class="note">*Please fill all requies form field, thanks!</p>
            </div>
        </form>
    </div>
</body>
</html>
