<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Multi Step Register</title>

<style>

body{
    font-family:Arial;
    padding:40px;
}

.form-step{
    display:none;
}

.form-step.active{
    display:block;
}

.error{
    color:red;
    font-size:14px;
}

.buttons{
    margin-top:20px;
}

button{
    padding:8px 16px;
    margin-right:10px;
}

/* Progress bar */

.progress{
    width:100%;
    background:#eee;
    height:10px;
    margin-bottom:20px;
    border-radius:5px;
}

.progress-bar{
    height:10px;
    width:33%;
    background:green;
    border-radius:5px;
    transition:0.3s;
}

.step-text{
    margin-bottom:10px;
    font-weight:bold;
}

</style>

</head>
<body>

<h2>Đăng ký tài khoản</h2>

<div class="step-text" id="stepText">Bước 1 / 3</div>

<div class="progress">
<div class="progress-bar" id="progressBar"></div>
</div>

<form id="registerForm">

<!-- STEP 1 -->

<div class="form-step active" id="step1">

<h3>Thông tin cá nhân</h3>

<label>Họ tên</label><br>
<input type="text" id="fullname">
<div class="error" id="fullnameError"></div>

<br><br>

<label>Ngày sinh</label><br>
<input type="date" id="birthday">
<div class="error" id="birthdayError"></div>

<br><br>

<label>Giới tính</label><br>
<input type="radio" name="gender" value="Nam"> Nam
<input type="radio" name="gender" value="Nữ"> Nữ
<div class="error" id="genderError"></div>

<div class="buttons">
<button type="button" onclick="nextStep()">Tiếp theo</button>
</div>

</div>


<!-- STEP 2 -->

<div class="form-step" id="step2">

<h3>Thông tin tài khoản</h3>

<label>Email</label><br>
<input type="text" id="email">
<div class="error" id="emailError"></div>

<br><br>

<label>Mật khẩu</label><br>
<input type="password" id="password">
<div class="error" id="passwordError"></div>

<br><br>

<label>Xác nhận mật khẩu</label><br>
<input type="password" id="confirmPassword">
<div class="error" id="confirmPasswordError"></div>

<div class="buttons">
<button type="button" onclick="prevStep()">Quay lại</button>
<button type="button" onclick="nextStep()">Tiếp theo</button>
</div>

</div>


<!-- STEP 3 -->

<div class="form-step" id="step3">

<h3>Xác nhận thông tin</h3>

<p><b>Họ tên:</b> <span id="confirmName"></span></p>
<p><b>Ngày sinh:</b> <span id="confirmBirthday"></span></p>
<p><b>Giới tính:</b> <span id="confirmGender"></span></p>
<p><b>Email:</b> <span id="confirmEmail"></span></p>

<div class="buttons">
<button type="button" onclick="prevStep()">Quay lại</button>
<button type="submit">Đăng ký</button>
</div>

</div>

</form>

<div id="successMessage"></div>

<script>

let currentStep = 1

function showStep(step){

    document.querySelectorAll(".form-step").forEach(s=>s.classList.remove("active"))

    document.getElementById("step"+step).classList.add("active")

    document.getElementById("stepText").innerText="Bước "+step+" / 3"

    document.getElementById("progressBar").style.width=(step*33)+"%"

}

function showError(id,message){
    document.getElementById(id+"Error").innerText=message
}

function clearError(id){
    document.getElementById(id+"Error").innerText=""
}

function validateStep1(){

    let valid=true

    const fullname=document.getElementById("fullname").value.trim()
    const birthday=document.getElementById("birthday").value
    const gender=document.querySelector('input[name="gender"]:checked')

    if(fullname===""){
        showError("fullname","Nhập họ tên")
        valid=false
    }else{
        clearError("fullname")
    }

    if(birthday===""){
        showError("birthday","Chọn ngày sinh")
        valid=false
    }else{
        clearError("birthday")
    }

    if(!gender){
        showError("gender","Chọn giới tính")
        valid=false
    }else{
        clearError("gender")
    }

    return valid

}

function validateStep2(){

    let valid=true

    const email=document.getElementById("email").value
    const password=document.getElementById("password").value
    const confirmPassword=document.getElementById("confirmPassword").value

    const emailRegex=/^[^\s@]+@[^\s@]+\.[^\s@]+$/

    if(!emailRegex.test(email)){
        showError("email","Email không hợp lệ")
        valid=false
    }else{
        clearError("email")
    }

    if(password.length<6){
        showError("password","Ít nhất 6 ký tự")
        valid=false
    }else{
        clearError("password")
    }

    if(confirmPassword!==password){
        showError("confirmPassword","Mật khẩu không khớp")
        valid=false
    }else{
        clearError("confirmPassword")
    }

    return valid

}

function nextStep(){

    if(currentStep===1 && !validateStep1()) return
    if(currentStep===2 && !validateStep2()) return

    currentStep++

    if(currentStep===3){

        document.getElementById("confirmName").innerText=
        document.getElementById("fullname").value

        document.getElementById("confirmBirthday").innerText=
        document.getElementById("birthday").value

        document.getElementById("confirmGender").innerText=
        document.querySelector('input[name="gender"]:checked').value

        document.getElementById("confirmEmail").innerText=
        document.getElementById("email").value
    }

    showStep(currentStep)

}

function prevStep(){

    currentStep--

    showStep(currentStep)

}

document.getElementById("registerForm").addEventListener("submit",function(e){

    e.preventDefault()

    document.getElementById("registerForm").style.display="none"

    document.getElementById("successMessage").innerText="Đăng ký thành công "

})

</script>

</body>
</html>
